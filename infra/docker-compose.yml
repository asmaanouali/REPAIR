name: irsam

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irsam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irsam}
      POSTGRES_DB: ${POSTGRES_DB:-irsam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irsam}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "8001:8000"
    volumes:
      - workspace:/tmp/irsam/workspace

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - workspace:/tmp/irsam/workspace

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      # Used by the browser (client-side) – points to the host-mapped port
      NEXT_PUBLIC_API_BASE: http://localhost:8001
      # Used by Next.js server-side rewrites inside the Docker network
      API_INTERNAL_BASE: http://api:8000
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  pgdata:
  workspace:
