name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-lint-test:
    name: apps/api (lint + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ir-sam (editable) and apps/api
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -e "./ir-sam"
          pip install -e "./apps/api[dev]"
      - name: Ruff
        working-directory: apps/api
        run: ruff check src tests
      - name: Pytest
        working-directory: apps/api
        env:
          IRSAM_QUEUE_BACKEND: inline
        run: pytest -q

  irsam-core-test:
    name: ir-sam core (lint + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        working-directory: ir-sam
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: ir-sam
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        working-directory: ir-sam
        run: pytest -q

  web-typecheck-build:
    name: apps/web (typecheck + lint + build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npx --no-install tsc --noEmit
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Upload .next
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            apps/web/.next
            apps/web/public
          retention-days: 1

  web-e2e:
    name: apps/web (Playwright smoke)
    runs-on: ubuntu-22.04
    needs: web-typecheck-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Download .next
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  schema-validation:
    name: JSON schemas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install check-jsonschema
      - run: check-jsonschema --check-metaschema ir-sam/schemas/irsam-finding.schema.json
      - run: check-jsonschema --check-metaschema ir-sam/schemas/binder.schema.json

  docker-build:
    name: Docker images
    runs-on: ubuntu-22.04
    needs: [api-lint-test, web-typecheck-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: |
          if [ -f apps/api/Dockerfile ]; then
            docker build -t irsam-api:ci apps/api
          fi
      - name: Build web image
        run: |
          if [ -f apps/web/Dockerfile ]; then
            docker build -t irsam-web:ci apps/web
          fi
      - name: Build worker image
        run: |
          if [ -f apps/worker/Dockerfile ]; then
            docker build -t irsam-worker:ci apps/worker
          fi
      - name: Build ir-sam image
        run: docker build -t ir-sam:ci ir-sam
