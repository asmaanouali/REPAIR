name: papers

on:
  push:
    paths:
      - 'paper-ieee/**'
      - 'paper-supervisor/**'
      - '.github/workflows/papers.yml'
  pull_request:
    paths:
      - 'paper-ieee/**'
      - 'paper-supervisor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paper: [paper-ieee, paper-supervisor]
    steps:
      - uses: actions/checkout@v4
      - name: Install tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - name: Build ${{ matrix.paper }}
        working-directory: ${{ matrix.paper }}
        run: make
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.paper }}-pdf
          path: ${{ matrix.paper }}/main.pdf
          if-no-files-found: error
