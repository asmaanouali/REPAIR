name: fast
# Fast tier (<=10 min): lint, type, schema, unit + property.
# Runs on every push and PR.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy core bench eval
      - name: Pytest (unit + property)
        run: pytest -m "unit or property" --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast-${{ matrix.python-version }}
          path: reports/test_runs/coverage.xml
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-fast-${{ matrix.python-version }}
          path: reports/test_runs/junit.xml

  schema-validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install check-jsonschema
      - run: check-jsonschema --check-metaschema schemas/irsam-finding.schema.json
      - run: check-jsonschema --check-metaschema schemas/binder.schema.json
