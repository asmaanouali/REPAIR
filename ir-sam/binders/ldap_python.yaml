dsl_version: "1"
catalog:
  id: ldap-python
  version: 0.1.0
  applies_to:
    interpreter: ldap
    host_language: python
    framework: ldap3
  parameterizing_apis:
    # LDAP has no "prepared statement"; the structural mitigation is
    # value escaping per RFC 4515 §3 (and RFC 4514 for DNs). We model the
    # escape helper as the parameterizing API.
    - ldap3.utils.conv.escape_filter_chars
    - ldap.filter.escape_filter_chars
  binders:
    - id: ldap-eq-value
      pattern:
        kind: LdapEquality
        children:
          - { kind: Attr, bind: a }
          - { kind: Hole, ctx: value, sem_in: [string], bind: v }
      rewrite:
        kind: parameterize
        template_string: "({a}={v.escaped})"
        bindings:
          - host_expr: "$v.host_expr"
            api: "{{ choose_ldap_escape($v) }}"
      proof_obligation: "Lemma 1' (LDAP value escaping closure: RFC4515 §3 escapes \\ * ( ) NUL)."

    - id: ldap-substring
      pattern:
        kind: LdapSubstring
        children:
          - { kind: Attr, bind: a }
          - { kind: Hole, ctx: value, sem_in: [string], bind: v }
      rewrite:
        kind: parameterize
        template_string: "({a}=*{v.escaped}*)"
        bindings:
          - host_expr: "$v.host_expr"
            api: "{{ choose_ldap_escape($v) }}"
      proof_obligation: "Lemma 1'."
