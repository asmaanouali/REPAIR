dsl_version: "0"
catalog:
  id: sql-pydbapi
  version: 0.1.0
  applies_to:
    interpreter: sql
    host_language: python
    framework: pep249   # sqlite3, psycopg2, mysql.connector, cx_Oracle
  parameterizing_apis:
    - sqlite3.Cursor.execute
    - sqlite3.Cursor.executemany
    - psycopg2.extensions.cursor.execute
    - psycopg2.extensions.cursor.executemany
    - mysql.connector.cursor.execute
    - cx_Oracle.Cursor.execute
  placeholder_styles:
    sqlite3: "?"        # qmark
    psycopg2: "%s"      # format
    mysql.connector: "%s"
    cx_Oracle: ":{n}"   # named
  binders:
    - id: sql-py-eq-value
      pattern:
        kind: Comparison
        children:
          - { kind: Column, bind: col }
          - { kind: Token,  lit: "=" }
          - { kind: Hole,   ctx: value,
              sem_in: [string, integer, decimal, boolean, date],
              bind: v }
      rewrite:
        template_string: "{col} = {placeholder}"
        bindings:
          - param_index: $auto
            host_expr: "$v.host_expr"
            api: "{{ choose_setter() }}"
      preconditions:
        - cursor_in_scope
      postconditions:
        - structural_value_via_parameterized_api: $v
      proof_obligation: "Lemma 1 (Parameter inertness)."

    - id: sql-py-like
      pattern:
        kind: LikeExpr
        children:
          - { kind: Column, bind: col }
          - { kind: Token, lit: "LIKE" }
          - { kind: Hole, ctx: value, sem_in: [string], bind: v }
      rewrite:
        template_string: "{col} LIKE {placeholder}"
        bindings:
          - param_index: $auto
            host_expr: "$v.host_expr"
            api: "{{ choose_setter() }}"
      proof_obligation: "Lemma 1 (Parameter inertness)."

    - id: sql-py-orderby-ident
      pattern:
        kind: OrderByCol
        children:
          - { kind: Hole, ctx: identifier, bind: c }
      rewrite:
        template_string: "ORDER BY {c.guarded}"
      preconditions:
        - allowlist_present: $c
      postconditions:
        - structural_identifier_via_allowlist: $c
      proof_obligation: "Lemma 2 (Identifier allow-list closure)."
