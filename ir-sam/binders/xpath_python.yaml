dsl_version: "1"
catalog:
  id: xpath-python
  version: 0.1.0
  applies_to:
    interpreter: xpath
    host_language: python
    framework: lxml
  parameterizing_apis:
    # lxml's XPath/.xpath() supports $name variable binding via kwargs,
    # making attacker values inert structural parameters.
    - lxml.etree.XPath.__call__
  binders:
    - id: xpath-eq-value
      pattern:
        kind: XPathPredicateEq
        children:
          - { kind: Attr, bind: a }
          - { kind: Hole, ctx: value, sem_in: [string, integer], bind: v }
      rewrite:
        kind: parameterize
        template_string: "@{a}={v.escaped}"
        bindings:
          - host_expr: "$v.host_expr"
            api: "{{ choose_xpath_variable_binding($v) }}"
      proof_obligation: "Lemma 1 (Parameter inertness via XPath variable binding)."

    - id: xpath-contains
      pattern:
        kind: XPathFnContains
        children:
          - { kind: Attr, bind: a }
          - { kind: Hole, ctx: value, sem_in: [string], bind: v }
      rewrite:
        kind: parameterize
        template_string: "contains(@{a}, {v.escaped})"
        bindings:
          - host_expr: "$v.host_expr"
            api: "{{ choose_xpath_variable_binding($v) }}"
      proof_obligation: "Lemma 1."
